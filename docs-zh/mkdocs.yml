site_name: Freqtrade 中文文档
site_description: Freqtrade 加密货币交易机器人中文文档
site_url: https://freqtrade.io/zh/

nav:
  - 主页: index.md
  - 快速开始:
    - Docker 快速入门: docker_quickstart.md
    - 安装指南: installation.md
    - Windows 安装: windows_installation.md
  - 配置:
    - 机器人配置: configuration.md
    - 机器人基础: bot-basics.md
    - 机器人使用: bot-usage.md
  - 策略开发:
    - 策略入门 101: strategy-101.md
    - 策略自定义: strategy-customization.md
    - 策略高级功能: strategy-advanced.md
  - 回测和分析:
    - 回测: backtesting.md
    - 数据分析: data-analysis.md
    - 数据下载: data-download.md
    - 绘图: plotting.md
  - FreqAI 机器学习:
    - FreqAI 介绍: freqai.md
    - FreqAI 配置: freqai-configuration.md
    - FreqAI 运行: freqai-running.md
  - 优化:
    - 超参数优化: hyperopt.md
  - 交易所和交易:
    - 支持的交易所: exchanges.md
    - 杠杆交易: leverage.md
    - 止损: stoploss.md
  - 用户界面和 API:
    - FreqUI: freq-ui.md
    - REST API: rest-api.md
    - Telegram 使用: telegram-usage.md
  - 工具和实用程序:
    - 命令行工具: commands/trade.md
    - 实用程序: utils.md
  - 参考:
    - 常见问题: faq.md

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search:
      lang: zh